<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeCut</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  background:
    linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,.9)),
    url("https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?auto=format&fit=crop&w=1600&q=80");
  background-size:cover;
  background-position:center;
  text-align:center;
}

nav{
  display:flex;
  justify-content:space-between;
  padding:20px;
}

.logo{
  color:#D4AF37;
  font-weight:bold;
  font-size:22px;
}

.hero{
  margin-top:80px;
}

.hero h1{
  font-size:40px;
}

.gold{
  color:#D4AF37;
}

button{
  margin-top:20px;
  padding:15px 25px;
  border:none;
  border-radius:25px;
  background:#D4AF37;
  font-weight:bold;
  cursor:pointer;
}

.box{
  margin:60px auto;
  padding:30px;
  width:300px;
  background:rgba(0,0,0,.6);
  border-radius:20px;
}

input,select{
  width:90%;
  padding:10px;
  margin:10px;
  border-radius:10px;
  border:none;
}

video{
  margin-top:20px;
  width:90%;
}
</style>
</head>

<body>

<nav>
  <div class="logo">🕌 VibeCut</div>
</nav>

<div class="hero">
  <h1>Crée ton clip avec une <span class="gold">âme orientale</span></h1>
  <button onclick="scrollToBox()">Créer</button>
</div>

<div class="box" id="box">
  <h2>Créer ton clip</h2>

  <input type="file" id="audio">

  <select id="style">
    <option value="oriental">Oriental</option>
    <option value="desert">Desert</option>
  </select>

  <button onclick="generate()">Générer</button>

  <p id="status"></p>
  <div id="result"></div>
</div>

<script>
function scrollToBox(){
  document.getElementById("box").scrollIntoView({behavior:"smooth"});
}

async function generate(){
  const file = document.getElementById("audio").files[0];
  const style = document.getElementById("style").value;
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if(!file){
    alert("Ajoute un audio !");
    return;
  }

  status.innerText = "Génération...";
  result.innerHTML = "";

  const formData = new FormData();
  formData.append("audio", file);
  formData.append("style", style);

  try{
    const res = await fetch("https://vibecut.onrender.com/generate",{
      method:"POST",
      body:formData
    });

    const data = await res.json();

    if(data.videoUrl){
      status.innerText = "Clip prêt !";
      result.innerHTML = "<video controls src='"+data.videoUrl+"'></video>";
    }else{
      status.innerText = "Erreur serveur";
    }

  }catch(e){
    status.innerText = "Erreur connexion";
  }
}
</script>

</body>
</html>
