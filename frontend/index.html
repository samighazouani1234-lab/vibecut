<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VibeCut - Clip IA oriental</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0b0f;
  color:white;
  text-align:center;
}

h1 {
  color:#D4AF37;
}

button {
  background:#D4AF37;
  border:none;
  padding:12px 20px;
  margin:10px;
  cursor:pointer;
  font-weight:bold;
}

.container {
  padding:40px;
}

.hidden {
  display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>VibeCut 🎬</h1>
<p>Crée ton clip IA style oriental</p>

<!-- STEP 1 -->
<div id="step1">
  <button onclick="goUpload()">Créer mon clip</button>
</div>

<!-- STEP 2 -->
<div id="step2" class="hidden">
  <h2>Upload ton son 🎵</h2>
  <input type="file" id="file" accept="audio/*"><br>
  <button onclick="goStyle()">Continuer</button>
</div>

<!-- STEP 3 -->
<div id="step3" class="hidden">
  <h2>Choisis un style</h2>

  <button onclick="generate()">🌙 Oriental Night</button>
  <button onclick="generate()">🏜 Desert</button>
  <button onclick="generate()">🕌 Royal</button>

</div>

<!-- STEP 4 -->
<div id="step4" class="hidden">
  <h2>Génération en cours...</h2>
  <p id="progress">0%</p>
</div>

<!-- STEP 5 -->
<div id="step5" class="hidden">
  <h2>Clip prêt 🔥</h2>
  <video controls width="300"
    src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">
  </video>
</div>

</div>

<script>

function goUpload(){
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");
}

function goStyle(){
  document.getElementById("step2").classList.add("hidden");
  document.getElementById("step3").classList.remove("hidden");
}

function generate(){
  document.getElementById("step3").classList.add("hidden");
  document.getElementById("step4").classList.remove("hidden");

  let progress = 0;

  let interval = setInterval(()=>{
    progress += 10;
    document.getElementById("progress").innerText = progress + "%";

    if(progress >= 100){
      clearInterval(interval);
      document.getElementById("step4").classList.add("hidden");
      document.getElementById("step5").classList.remove("hidden");
    }

  }, 300);
}

</script>

</body>
</html>
