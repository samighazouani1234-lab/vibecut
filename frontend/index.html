<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>VibeCut 🎬</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b0b0b, #1a0000);
      color: white;
      text-align: center;
    }

    h1 {
      color: #f5c542;
      margin-top: 40px;
      font-size: 40px;
    }

    .container {
      margin-top: 50px;
    }

    input, select {
      margin: 15px;
      padding: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #f5c542;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ffdb6e;
    }

    video {
      margin-top: 30px;
      max-width: 90%;
      border-radius: 15px;
    }

    .loader {
      margin-top: 20px;
      display: none;
    }
  </style>
</head>

<body>

  <h1>VibeCut 🎬</h1>
  <p>Crée ton clip IA style oriental</p>

  <div class="container">
    <input type="file" id="audioInput" accept="audio/*"><br>

    <select id="style">
      <option value="oriental">Oriental</option>
      <option value="maghrebin">Maghrebin</option>
      <option value="cinematic">Cinematic</option>
    </select><br>

    <button onclick="generateVideo()">Générer</button>

    <div class="loader" id="loader">⏳ Génération en cours...</div>

    <div id="result"></div>
  </div>

  <script>
    const BACKEND_URL = "https://vibecut.onrender.com";

    async function generateVideo() {
      const fileInput = document.getElementById("audioInput");
      const style = document.getElementById("style").value;
      const loader = document.getElementById("loader");
      const result = document.getElementById("result");

      if (!fileInput.files[0]) {
        alert("Choisis un fichier audio !");
        return;
      }

      const formData = new FormData();
      formData.append("audio", fileInput.files[0]);
      formData.append("style", style);

      loader.style.display = "block";
      result.innerHTML = "";

      try {
        const res = await fetch(`${BACKEND_URL}/generate`, {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        loader.style.display = "none";

        if (data.videoUrl) {
          result.innerHTML = `
            <h2>Ton clip est prêt 🔥</h2>
            <video controls src="${data.videoUrl}"></video>
          `;
        } else {
          result.innerHTML = "Erreur génération ❌";
        }

      } catch (err) {
        loader.style.display = "none";
        result.innerHTML = "Erreur serveur ❌";
        console.error(err);
      }
    }
  </script>

</body>
</html>
