<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VibeCut | Clip IA Oriental</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  color:white;
  background:linear-gradient(135deg,#080808,#250000);
  text-align:center;
}

.container{
  max-width:900px;
  margin:auto;
  padding:50px 20px;
}

h1{
  color:#f5c542;
  font-size:48px;
  margin-bottom:15px;
}

p{
  color:#ddd;
  font-size:18px;
}

.card{
  margin:45px auto;
  padding:35px;
  max-width:520px;
  border-radius:26px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(245,197,66,0.25);
  box-shadow:0 0 50px rgba(245,197,66,0.12);
}

input,select{
  margin:15px 0;
  padding:13px;
  border-radius:12px;
  border:none;
  width:85%;
  max-width:320px;
  font-size:16px;
}

button{
  margin-top:20px;
  padding:16px 35px;
  border:none;
  border-radius:40px;
  background:linear-gradient(135deg,#d4af37,#ff8c42);
  color:#111;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 0 30px rgba(212,175,55,.35);
}

button:hover{
  transform:translateY(-2px);
}

#progress{
  margin-top:25px;
  font-size:18px;
  color:#f5c542;
}

.loaderbar{
  width:80%;
  max-width:420px;
  height:12px;
  background:#222;
  border-radius:20px;
  overflow:hidden;
  margin:20px auto;
  display:none;
}

.loaderfill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#d4af37,#ff8c42);
  transition:.3s;
}

video{
  margin-top:30px;
  width:90%;
  max-width:700px;
  border-radius:22px;
  border:1px solid rgba(245,197,66,.35);
}

.result-box{
  margin-top:35px;
}

footer{
  margin-top:80px;
  color:#777;
}
</style>
</head>

<body>

<div class="container">
  <h1>VibeCut 🎬</h1>
  <p>Crée ton clip IA style oriental</p>

  <div class="card">
    <input type="file" id="audioInput" accept="audio/*">

    <br>

    <select id="style">
      <option value="oriental">Oriental</option>
      <option value="maghrebin">Maghrébin</option>
      <option value="desert">Désert</option>
      <option value="royal">Royal Arabic</option>
      <option value="cinematic">Cinématique</option>
    </select>

    <br>

    <button onclick="generateVideo()">Générer mon clip</button>

    <div id="progress"></div>

    <div class="loaderbar" id="loaderbar">
      <div class="loaderfill" id="loaderfill"></div>
    </div>
  </div>

  <div id="result" class="result-box"></div>

  <footer>
    © 2026 VibeCut — Clips IA pour artistes
  </footer>
</div>

<script>
const BACKEND_URL = "https://vibecut.onrender.com";

async function generateVideo(){
  const fileInput = document.getElementById("audioInput");
  const style = document.getElementById("style").value;
  const result = document.getElementById("result");
  const progress = document.getElementById("progress");
  const loaderbar = document.getElementById("loaderbar");
  const loaderfill = document.getElementById("loaderfill");

  if(!fileInput.files[0]){
    alert("Choisis un fichier audio !");
    return;
  }

  result.innerHTML = "";
  progress.innerHTML = "⏳ Envoi du son au serveur...";
  loaderbar.style.display = "block";
  loaderfill.style.width = "10%";

  let fakeProgress = 10;

  const interval = setInterval(() => {
    fakeProgress += 10;

    if(fakeProgress <= 90){
      loaderfill.style.width = fakeProgress + "%";
    }

    if(fakeProgress === 30){
      progress.innerHTML = "🎵 Analyse du son...";
    }

    if(fakeProgress === 60){
      progress.innerHTML = "🎬 Création du clip...";
    }

    if(fakeProgress === 90){
      progress.innerHTML = "✨ Finalisation...";
    }
  }, 500);

  const formData = new FormData();
  formData.append("audio", fileInput.files[0]);
  formData.append("style", style);

  try{
    const res = await fetch(`${BACKEND_URL}/generate`, {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    clearInterval(interval);
    loaderfill.style.width = "100%";
    progress.innerHTML = "✅ Génération terminée";

    if(data.videoUrl){
      result.innerHTML = `
        <h2>Ton clip est prêt 🔥</h2>
        <video controls src="${data.videoUrl}"></video>
        <br>
        <button onclick="location.reload()">Créer un autre clip</button>
      `;
    } else {
      result.innerHTML = "<p>Erreur : aucune vidéo reçue.</p>";
    }

  } catch(error){
    clearInterval(interval);
    loaderbar.style.display = "none";
    progress.innerHTML = "❌ Erreur serveur. Réessaie.";
    console.error(error);
  }
}
</script>

</body>
</html>
