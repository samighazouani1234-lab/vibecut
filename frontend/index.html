<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeCut PRO</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family: 'Segoe UI', sans-serif;
  color:white;
  min-height:100vh;

  background:
    linear-gradient(90deg, rgba(0,0,0,.85), rgba(0,0,0,.2), rgba(0,0,0,.9)),
    url("https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?auto=format&fit=crop&w=1800&q=90");

  background-size:cover;
  background-position:center;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:25px;
}

.logo{
  font-size:26px;
  color:#f6c955;
  font-weight:bold;
}

nav a{
  color:white;
  margin:0 15px;
  text-decoration:none;
}

/* HERO */
.hero{
  padding:80px 20px;
  animation:fadeIn 1s ease;
}

.hero h1{
  font-size:55px;
  max-width:600px;
}

.gold{color:#f6c955}

.hero p{
  margin-top:20px;
  color:#ddd;
  max-width:500px;
}

/* BUTTON */
.btn{
  margin-top:25px;
  background:linear-gradient(45deg,#f6c955,#ff9a00);
  border:none;
  padding:15px 30px;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px rgba(246,201,85,.5);
}

/* GLASS BOX */
.box{
  margin:50px auto;
  max-width:500px;
  padding:30px;
  border-radius:20px;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
  text-align:center;
  animation:fadeUp 1s ease;
}

input,select{
  padding:12px;
  margin:10px;
  width:90%;
  border-radius:10px;
  border:none;
}

/* LOADER */
.loader{
  display:none;
  height:8px;
  width:80%;
  background:#222;
  margin:20px auto;
  border-radius:10px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#f6c955,#ff9a00);
  animation:load 3s linear infinite;
}

/* VIDEO */
video{
  margin-top:20px;
  width:100%;
  border-radius:15px;
}

/* ANIMATIONS */
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes load{
  0%{width:0%}
  50%{width:70%}
  100%{width:100%}
}

/* MOBILE */
@media(max-width:768px){
  .hero h1{font-size:35px}
}
</style>

</head>

<body>

<!-- NAV -->
<nav>
  <div class="logo">🕌 VibeCut</div>
  <div>
    <a href="#">Accueil</a>
    <a href="#">Styles</a>
    <a href="#">Créer</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>
    Crée ton clip avec une
    <span class="gold">âme orientale</span>
  </h1>

  <p>
    Génère automatiquement ton clip vidéo IA inspiré du désert,
    des médinas et du Maghreb.
  </p>

  <button class="btn" onclick="scrollToCreate()">Créer maintenant</button>
</section>

<!-- GENERATE -->
<div class="box" id="create">

  <h2>Créer ton clip</h2>

  <input type="file" id="audio">

  <select id="style">
    <option value="oriental">Oriental</option>
    <option value="desert">Desert</option>
    <option value="royal">Royal</option>
  </select>

  <button class="btn" onclick="generate()">Générer</button>

  <div class="loader" id="loader">
    <div class="bar"></div>
  </div>

  <p id="status"></p>

  <div id="result"></div>

</div>

<script>

function scrollToCreate(){
  document.getElementById("create").scrollIntoView({behavior:"smooth"});
}

async function generate(){
  const file = document.getElementById("audio").files[0];
  const style = document.getElementById("style").value;
  const loader = document.getElementById("loader");
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if(!file){
    alert("Ajoute un audio !");
    return;
  }

  loader.style.display = "block";
  status.innerText = "Génération en cours...";
  result.innerHTML = "";

  const formData = new FormData();
  formData.append("audio", file);
  formData.append("style", style);

  try{
    const res = await fetch("https://vibecut.onrender.com/generate",{
      method:"POST",
      body:formData
    });

    const data = await res.json();

    loader.style.display = "none";

    if(data.videoUrl){
      status.innerText = "🔥 Clip prêt !";
      result.innerHTML = `
        <video controls src="${data.videoUrl}"></video>
        <br><br>
        <a href="${data.videoUrl}" target="_blank">
          <button class="btn">Télécharger</button>
        </a>
      `;
    }else{
      status.innerText = "Erreur serveur";
    }

  }catch(e){
    loader.style.display = "none";
    status.innerText = "Erreur connexion";
  }
}

</script>

</body>
</html>
