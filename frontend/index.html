<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeCut</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  color:white;
  background:
    linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.95)),
    url("https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?auto=format&fit=crop&w=1600&q=80");
  background-size:cover;
  background-position:center;
}

/* NAVBAR */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
}

nav h2{
  color:#D4AF37;
}

nav a{
  color:white;
  margin-left:20px;
  text-decoration:none;
}

/* HERO */
.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:80px;
}

.hero-text h1{
  font-size:50px;
}

.gold{
  color:#D4AF37;
}

button{
  background:linear-gradient(45deg,#D4AF37,#ff9a00);
  border:none;
  padding:15px 25px;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
  box-shadow:0 0 20px rgba(212,175,55,0.5);
}

/* VIDEO BOX */
.video-box{
  width:400px;
  height:250px;
  border-radius:20px;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

/* UPLOAD */
.upload-box{
  margin:60px auto;
  width:350px;
  padding:30px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  text-align:center;
}

select,input{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  border:none;
  width:100%;
}

/* CARDS */
.styles{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:40px;
}

.style-card{
  width:200px;
  padding:10px;
  border-radius:15px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  text-align:center;
}

.style-card img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:10px;
}
</style>

</head>

<body>

<!-- NAV -->
<nav>
  <h2>🏰 VibeCut</h2>
  <div>
    <a href="#">Styles</a>
    <a href="#">Créer</a>
    <a href="#">Résultat</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-text">
    <h1>Crée ton clip avec une <span class="gold">âme orientale</span></h1>
    <p>Transforme ton son en clip inspiré du désert, médinas et architecture orientale.</p>
    <button onclick="scrollToUpload()">Créer mon clip</button>
  </div>

  <div class="video-box">
    ▶
  </div>
</section>

<!-- UPLOAD -->
<div class="upload-box" id="upload">
  <h2>Créer ton clip</h2>

  <input type="file" id="audio">

  <select id="style">
    <option value="desert">Desert</option>
    <option value="royal">Royal Arabic</option>
    <option value="night">Oriental Night</option>
  </select>

  <button onclick="generate()">Générer</button>

  <p id="status"></p>
</div>

<!-- STYLES -->
<div class="styles">

  <div class="style-card">
    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470">
    <h3>Desert</h3>
  </div>

  <div class="style-card">
    <img src="https://images.unsplash.com/photo-1524492412937-b28074a5d7da">
    <h3>Royal</h3>
  </div>

  <div class="style-card">
    <img src="https://images.unsplash.com/photo-1548013146-72479768bada">
    <h3>Night</h3>
  </div>

</div>

<script>

function scrollToUpload(){
  document.getElementById("upload").scrollIntoView({behavior:"smooth"});
}

async function generate(){
  const file = document.getElementById("audio").files[0];
  const style = document.getElementById("style").value;
  const status = document.getElementById("status");

  if(!file){
    alert("Ajoute un audio !");
    return;
  }

  status.innerText = "Génération...";

  const formData = new FormData();
  formData.append("audio", file);
  formData.append("style", style);

  try{
    const res = await fetch("/generate",{
      method:"POST",
      body:formData
    });

    const data = await res.json();

    if(data.videoUrl){
      status.innerHTML = "<video controls width='300' src='"+data.videoUrl+"'></video>";
    } else {
      status.innerText = "Erreur serveur";
    }

  }catch(e){
    status.innerText = "Erreur";
  }
}

</script>

</body>
</html>
